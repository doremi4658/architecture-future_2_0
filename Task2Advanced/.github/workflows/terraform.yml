name: "Terraform CI/CD"

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      action:
        description: 'Terraform action (plan/apply)'
        required: true
        default: 'plan'
        type: choice
        options:
          - plan
          - apply

env:
  # Бэкенд-конфигурация — хранится в секретах
  TF_BACKEND_BUCKET: ${{ secrets.TF_BACKEND_BUCKET }}
  TF_BACKEND_KEY: dev/terraform.tfstate   # можно сделать отдельные пайплайны для окружений
  TF_BACKEND_REGION: ru-central1
  TF_BACKEND_ENDPOINT: https://storage.yandexcloud.net
  # Провайдер Yandex Cloud — аутентификация через статический ключ (лучше IAM-токен, но для примера ключ)
  YC_ACCESS_KEY: ${{ secrets.YC_ACCESS_KEY }}
  YC_SECRET_KEY: ${{ secrets.YC_SECRET_KEY }}
  YC_CLOUD_ID: ${{ secrets.YC_CLOUD_ID }}
  YC_FOLDER_ID: ${{ secrets.YC_FOLDER_ID }}

jobs:
  terraform:
    name: "Terraform"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="endpoint=${{ env.TF_BACKEND_ENDPOINT }}" \
            -backend-config="bucket=${{ env.TF_BACKEND_BUCKET }}" \
            -backend-config="key=${{ env.TF_BACKEND_KEY }}" \
            -backend-config="region=${{ env.TF_BACKEND_REGION }}" \
            -backend-config="access_key=${{ env.YC_ACCESS_KEY }}" \
            -backend-config="secret_key=${{ env.YC_SECRET_KEY }}"

      - name: Terraform Plan
        if: github.event_name == 'pull_request' || github.event.inputs.action == 'plan'
        run: terraform plan -input=false -no-color
        env:
          YC_TOKEN: ${{ secrets.YC_TOKEN }}   # для провайдера (если используется токен)

      - name: Terraform Apply
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'apply'
        run: terraform apply -auto-approve -input=false -no-color
        env:
          YC_TOKEN: ${{ secrets.YC_TOKEN }}